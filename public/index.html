<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Studio</h1>
      <p class="tagline">Small classes. Book a seat, or wait for one.</p>

      <form id="identity" novalidate hidden>
        <h2>Who are you?</h2>
        <p class="hint">The studio needs a way to reach you if a class changes.</p>

        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" />
        <p class="field-error" data-error-for="name"></p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <p class="field-error" data-error-for="email"></p>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" />
        <p class="field-error" data-error-for="phone"></p>

        <button type="submit">Continue</button>
      </form>

      <section aria-labelledby="schedule-heading">
        <h2 id="schedule-heading">Schedule</h2>
        <div id="schedule"></div>
      </section>

      <section id="mine-section" aria-labelledby="mine-heading" hidden>
        <h2 id="mine-heading">My bookings</h2>
        <div id="mine"></div>
      </section>
    </main>

    <div id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
