name: CI

on:
  push:
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Browsers
        run: npx playwright install --with-deps chromium

      # One run, so the published report holds both projects: a second run
      # would overwrite the first one's report.
      - name: API and E2E tests
        run: npm run test:all-playwright

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rules and the validation are pure, so this needs no browser and no
      # server — it only asks whether the unit tests would notice a change.
      - name: Mutation testing (rules and validation)
        run: npm run test:mutation

      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report/
          retention-days: 7

  publish:
    name: Publish the reports
    needs: [test, mutation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/playwright

      - uses: actions/download-artifact@v4
        with:
          name: mutation-report
          path: site/mutation

      - name: The page that points at them
        run: |
          sed -e "s/COMMIT_SHA/${GITHUB_SHA::7}/" \
              -e "s/BUILT_AT/$(date -u '+%d %B %Y, %H:%M UTC')/" \
              docs/pages/index.html > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: pages
        uses: actions/deploy-pages@v4
